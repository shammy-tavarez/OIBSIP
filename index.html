<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculator</title>
   <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div id="expression"></div>
            <div id="result">0</div>
        </div>
        <div class="buttons">
            <button class="special">(</button>
            <button class="special">)</button>
            <button class="special" id="ans">ans</button>
            <button class="special" id="del">del</button>
            <button class="special" id="clear">clear</button>
            
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">%</button>
            <button class="operator">√</button>
            
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">x</button>
            <button class="operator">÷</button>
            
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>
            <button class="operator">-</button>
            
            <button>.</button>
            <button>0</button>
            <button class="operator">±</button>
            <button class="operator equals" id="enter">ENTER</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
